<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wi-Fi Mobile Camera Stream Test</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- PeerJS Library for WebRTC P2P Video Streaming -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Tab Buttons */
    .app-header {
      background: #1e293b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Card Container */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .view-title {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-align: center;
    }

    /* View Section Control */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* Video Containers */
    .video-container {
      position: relative;
      width: 100%;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-video {
      aspect-ratio: 4 / 3;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 15;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .fullscreen-btn:hover {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    /* Native Fullscreen Container Styles */
    :fullscreen, :-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      background: #000000 !important;
    }

    :fullscreen video, :-webkit-full-screen video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .laptop-video {
      aspect-ratio: 16 / 9;
      min-height: 280px;
      cursor: pointer;
    }

    /* Laptop Video Rotation Transforms */
    #remoteVideo {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
      max-width: 100%;
      max-height: 100%;
    }

    #remoteVideo.rotate-90 {
      transform: rotate(90deg) scale(0.62);
    }

    #remoteVideo.rotate-180 {
      transform: rotate(180deg);
    }

    #remoteVideo.rotate-270 {
      transform: rotate(270deg) scale(0.62);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    .video-overlay.hidden {
      display: none;
    }

    /* Info Box & Connection Address */
    .info-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .info-label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .info-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
      user-select: all;
    }

    /* Status Badges */
    .status-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: #cbd5e1;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-dot.yellow {
      background-color: #eab308;
      box-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
    }

    .status-dot.red {
      background-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    .status-dot.gray {
      background-color: #64748b;
    }

    /* Laptop Form Controls */
    .connect-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-label {
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Buttons */
    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* Laptop Status Bar */
    .laptop-status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      font-size: 16px;
      font-weight: 600;
    }

    .status-value.disconnected { color: #94a3b8; }
    .status-value.connecting { color: #eab308; }
    .status-value.connected { color: #3b82f6; }
    .status-value.streaming { color: #22c55e; }

    /* Loading Spinner */
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- Mode Selector Tabs -->
    <header class="app-header">
      <div class="mode-tabs">
        <button id="tabMobile" class="tab-btn active" onclick="setMode('mobile')">📱 Mobile Mode</button>
        <button id="tabLaptop" class="tab-btn" onclick="setMode('laptop')">💻 Laptop Mode</button>
      </div>
    </header>

    <!-- MOBILE MODE VIEW -->
    <main id="mobileView" class="view-section active">
      <div class="card">
        <h1 class="view-title">CAMERA TEST</h1>

        <!-- Mobile Live Camera Preview -->
        <div class="video-container mobile-video" id="mobileVideoContainer">
          <video id="mobilePreview" autoplay playsinline muted></video>
          
          <!-- Top Right Fullscreen Button -->
          <button id="btnMobileFullscreen" class="fullscreen-btn" onclick="toggleMobileFullscreen()" title="Toggle Fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>

          <div id="cameraOverlay" class="video-overlay">
            <span class="spinner"></span>
            <p id="cameraOverlayText">Requesting Camera Access...</p>
          </div>
        </div>

        <!-- Connection Address Banner -->
        <div class="info-box">
          <div class="info-label">Mobile Connection Code / Address:</div>
          <div id="mobileAddressDisplay" class="info-value">Generating Code...</div>
        </div>

        <!-- Mobile Status Badges -->
        <div class="status-list">
          <div class="status-item">
            <span id="statusCameraDot" class="status-dot yellow"></span>
            <span>Camera: <strong id="statusCameraText">Initializing...</strong></span>
          </div>
          <div class="status-item">
            <span id="statusNetworkDot" class="status-dot green"></span>
            <span>Network: <strong id="statusNetworkText">Connected</strong></span>
          </div>
          <div class="status-item">
            <span id="statusStreamingDot" class="status-dot yellow"></span>
            <span>Streaming: <strong id="statusStreamingText">Waiting for Laptop</strong></span>
          </div>
        </div>

        <button id="btnRetryCamera" class="btn btn-secondary hidden" onclick="startMobileCamera()">Retry Camera</button>
      </div>
    </main>

    <!-- LAPTOP MODE VIEW -->
    <main id="laptopView" class="view-section">
      <div class="card">
        <h1 class="view-title">CAMERA VIEWER</h1>

        <!-- Address Entry & Connect Form -->
        <div class="connect-form">
          <label for="inputMobileAddress" class="input-label">Enter Mobile Connection Code / Address:</label>
          <div class="input-group">
            <input type="text" id="inputMobileAddress" placeholder="e.g. CAM-4892 or 192.168.0.7" spellcheck="false" autocomplete="off">
            <button id="btnConnect" class="btn btn-primary" onclick="connectToMobile()">CONNECT</button>
          </div>
        </div>

        <!-- Laptop Video Display Area -->
        <div class="video-container laptop-video" id="laptopVideoContainer" onclick="rotateLaptopVideo(event)">
          <video id="remoteVideo" autoplay playsinline muted></video>

          <!-- Top Right Rotate 90° Button -->
          <button id="btnLaptopRotate" class="fullscreen-btn" onclick="rotateLaptopVideo(event)" title="Rotate Video 90°">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>

          <div id="remoteOverlay" class="video-overlay">
            <p id="remoteOverlayText">[ LIVE MOBILE CAMERA ]</p>
          </div>
        </div>

        <!-- Laptop Connection Status -->
        <div class="laptop-status-bar">
          <span class="status-label">Status:</span>
          <span id="statusLaptopDot" class="status-dot gray"></span>
          <span id="statusLaptopText" class="status-value disconnected">Disconnected</span>
        </div>
      </div>
    </main>

  </div>

  <script>
    let currentMode = 'mobile';
    let localStream = null;
    let peer = null;
    let currentCall = null;
    let dataConn = null;
    let myPeerId = null;
    let laptopRotationAngle = 0;

    // Elements
    const tabMobile = document.getElementById('tabMobile');
    const tabLaptop = document.getElementById('tabLaptop');
    const mobileView = document.getElementById('mobileView');
    const laptopView = document.getElementById('laptopView');

    const mobilePreview = document.getElementById('mobilePreview');
    const cameraOverlay = document.getElementById('cameraOverlay');
    const cameraOverlayText = document.getElementById('cameraOverlayText');
    const mobileAddressDisplay = document.getElementById('mobileAddressDisplay');

    const statusCameraDot = document.getElementById('statusCameraDot');
    const statusCameraText = document.getElementById('statusCameraText');
    const statusNetworkDot = document.getElementById('statusNetworkDot');
    const statusNetworkText = document.getElementById('statusNetworkText');
    const statusStreamingDot = document.getElementById('statusStreamingDot');
    const statusStreamingText = document.getElementById('statusStreamingText');

    const inputMobileAddress = document.getElementById('inputMobileAddress');
    const btnConnect = document.getElementById('btnConnect');
    const remoteVideo = document.getElementById('remoteVideo');
    const remoteOverlay = document.getElementById('remoteOverlay');
    const remoteOverlayText = document.getElementById('remoteOverlayText');
    const statusLaptopDot = document.getElementById('statusLaptopDot');
    const statusLaptopText = document.getElementById('statusLaptopText');

    window.addEventListener('DOMContentLoaded', () => {
      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
      setMode(isMobile ? 'mobile' : 'laptop');
    });

    function setMode(mode) {
      currentMode = mode;
      cleanupPeer();

      if (mode === 'mobile') {
        tabMobile.classList.add('active');
        tabLaptop.classList.remove('active');
        mobileView.classList.add('active');
        laptopView.classList.remove('active');

        startMobileCamera();
      } else {
        tabLaptop.classList.add('active');
        tabMobile.classList.remove('active');
        laptopView.classList.add('active');
        mobileView.classList.remove('active');

        stopLocalCamera();
        updateLaptopStatus('disconnected', 'Disconnected');
        initLaptopPeer();
      }
    }

    // Toggle Fullscreen on Mobile Camera View
    function toggleMobileFullscreen() {
      const container = document.getElementById('mobileVideoContainer');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        } else if (mobilePreview.webkitEnterFullscreen) {
          mobilePreview.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Rotate Laptop Video Preview
    function rotateLaptopVideo(e) {
      if (e) e.stopPropagation();
      laptopRotationAngle = (laptopRotationAngle + 90) % 360;
      applyVideoTransform(laptopRotationAngle);
    }

    function applyVideoTransform(angle) {
      const video = document.getElementById('remoteVideo');
      if (!video) return;

      let norm = ((angle % 360) + 360) % 360;
      laptopRotationAngle = norm;

      video.className = '';
      if (norm === 90) {
        video.classList.add('rotate-90');
      } else if (norm === 180) {
        video.classList.add('rotate-180');
      } else if (norm === 270) {
        video.classList.add('rotate-270');
      }
    }

    // Automatic Laptop Video Counter-Rotation (Opposite Direction for Upright View)
    function applyAutoRotation(phoneAngle) {
      let laptopAngle = (360 - (phoneAngle % 360)) % 360;
      console.log(`Phone Angle: ${phoneAngle}°, Counter-Rotating Laptop to: ${laptopAngle}°`);
      applyVideoTransform(laptopAngle);
    }

    // Auto-detect video dimensions on metadata load
    if (remoteVideo) {
      remoteVideo.onloadedmetadata = () => {
        console.log(`Video metadata loaded: ${remoteVideo.videoWidth}x${remoteVideo.videoHeight}`);
        // If portrait frame sent to landscape container, auto counter-rotate 90 deg
        if (remoteVideo.videoWidth < remoteVideo.videoHeight && laptopRotationAngle === 0) {
          applyVideoTransform(90);
        }
      };
    }

    // ==========================================
    // MOBILE MODE LOGIC
    // ==========================================

    async function startMobileCamera() {
      updateCameraStatus('yellow', 'Requesting Permission...');
      cameraOverlay.classList.remove('hidden');
      cameraOverlayText.textContent = 'Requesting Rear Camera Permission...';
      document.getElementById('btnRetryCamera').classList.add('hidden');

      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        } catch (e) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });
        }

        localStream = stream;
        mobilePreview.srcObject = stream;
        await mobilePreview.play().catch(e => console.warn('Preview play:', e));
        cameraOverlay.classList.add('hidden');

        updateCameraStatus('green', 'Connected');
        updateStreamingStatus('yellow', 'Ready');

        initMobilePeer();
        setupMobileOrientationTracking();

      } catch (err) {
        console.error('Camera Error:', err);
        updateCameraStatus('red', 'Permission Denied / Error');
        cameraOverlayText.textContent = '❌ Camera Access Failed: ' + err.message;
        document.getElementById('btnRetryCamera').classList.remove('hidden');
      }
    }

    function generateShortCode() {
      const code = Math.floor(1000 + Math.random() * 9000);
      return `CAM-${code}`;
    }

    function getMobileOrientationAngle() {
      let angle = 0;
      if (screen.orientation && screen.orientation.angle !== undefined) {
        angle = screen.orientation.angle;
      } else if (window.orientation !== undefined) {
        angle = window.orientation;
      }
      return ((angle % 360) + 360) % 360;
    }

    function sendMobileOrientation() {
      const angle = getMobileOrientationAngle();
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'orientation', angle: angle });
      }
    }

    function setupMobileOrientationTracking() {
      const handleOrient = () => {
        sendMobileOrientation();
      };

      if (screen.orientation) {
        screen.orientation.addEventListener('change', handleOrient);
      }
      window.addEventListener('orientationchange', handleOrient);
      window.addEventListener('resize', handleOrient);
    }

    function initMobilePeer() {
      cleanupPeer();

      const customId = generateShortCode();

      if (typeof Peer !== 'undefined') {
        peer = new Peer(customId, { debug: 1 });

        peer.on('open', (id) => {
          myPeerId = id;
          mobileAddressDisplay.textContent = id;
          console.log('Mobile Peer ID ready:', id);
        });

        peer.on('connection', (conn) => {
          dataConn = conn;
          dataConn.on('open', () => {
            sendMobileOrientation();
          });
        });

        peer.on('call', (call) => {
          console.log('Incoming call from laptop');
          updateStreamingStatus('yellow', 'Connecting to Laptop...');
          currentCall = call;

          call.answer(localStream);

          call.on('stream', (remoteStream) => {
            console.log('Stream established with laptop');
          });

          updateStreamingStatus('green', 'Streaming to Laptop');

          call.on('close', () => {
            updateStreamingStatus('yellow', 'Ready (Waiting for Laptop)');
          });

          call.on('error', (err) => {
            console.error('Call error:', err);
            updateStreamingStatus('yellow', 'Ready');
          });
        });

        peer.on('error', (err) => {
          console.warn('PeerJS fallback to random ID:', err);
          if (err.type === 'unavailable-id') {
            peer = new Peer({ debug: 1 });
            peer.on('open', id => {
              myPeerId = id;
              mobileAddressDisplay.textContent = id;
            });
          }
        });
      } else {
        mobileAddressDisplay.textContent = window.location.hostname;
      }
    }

    function stopLocalCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      mobilePreview.srcObject = null;
    }

    function updateCameraStatus(color, text) {
      statusCameraDot.className = `status-dot ${color}`;
      statusCameraText.textContent = text;
    }

    function updateStreamingStatus(color, text) {
      statusStreamingDot.className = `status-dot ${color}`;
      statusStreamingText.textContent = text;
    }

    // ==========================================
    // LAPTOP MODE LOGIC
    // ==========================================

    function initLaptopPeer() {
      cleanupPeer();
      if (typeof Peer !== 'undefined') {
        peer = new Peer({ debug: 1 });
        peer.on('open', id => console.log('Laptop Peer ready:', id));
      }
    }

    async function connectToMobile() {
      let code = inputMobileAddress.value.trim();
      if (!code) {
        alert('Please enter the Mobile Connection Code (e.g. CAM-1234) shown on your mobile screen.');
        return;
      }

      code = code.replace(/^https?:\/\//i, '').split('/')[0].split(':')[0].trim();

      updateLaptopStatus('connecting', 'Connecting...');
      remoteOverlayText.textContent = 'Connecting to Mobile Camera Stream...';
      remoteOverlay.classList.remove('hidden');

      if (!peer || peer.destroyed) {
        peer = new Peer({ debug: 1 });
        await new Promise(r => peer.on('open', r));
      }

      dataConn = peer.connect(code);
      dataConn.on('open', () => {
        console.log('Data connection open with mobile');
      });
      dataConn.on('data', (data) => {
        if (data && data.type === 'orientation') {
          console.log('Auto rotation received from phone:', data.angle);
          applyAutoRotation(data.angle);
        }
      });

      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const dummyStream = canvas.captureStream(1);

      console.log('Calling mobile peer:', code);
      const call = peer.call(code, dummyStream);
      currentCall = call;

      call.on('stream', async (remoteStream) => {
        console.log('Laptop received remote stream!');
        remoteVideo.srcObject = remoteStream;
        remoteVideo.muted = true;
        try {
          await remoteVideo.play();
        } catch (e) {
          console.warn('Autoplay error:', e);
        }
        remoteOverlay.classList.add('hidden');
        updateLaptopStatus('streaming', 'Streaming');

        // Automatic orientation check on metadata load
        if (remoteVideo.videoWidth < remoteVideo.videoHeight && laptopRotationAngle === 0) {
          applyVideoTransform(90);
        }
      });

      call.on('close', () => {
        updateLaptopStatus('disconnected', 'Disconnected');
        remoteOverlay.classList.remove('hidden');
        remoteOverlayText.textContent = 'Stream Closed';
      });

      call.on('error', (err) => {
        console.error('Laptop call error:', err);
        updateLaptopStatus('disconnected', 'Connection Failed');
        remoteOverlayText.textContent = 'Connection Failed. Please check Code.';
      });

      setTimeout(() => {
        if (remoteOverlayText.textContent === 'Connecting to Mobile Camera Stream...' && !remoteVideo.srcObject) {
          updateLaptopStatus('connecting', 'Still Connecting... Check Code on Phone');
        }
      }, 5000);
    }

    function updateLaptopStatus(stateClass, text) {
      const dotColorMap = {
        disconnected: 'gray',
        connecting: 'yellow',
        connected: 'green',
        streaming: 'green'
      };
      statusLaptopDot.className = `status-dot ${dotColorMap[stateClass] || 'gray'}`;
      statusLaptopText.className = `status-value ${stateClass}`;
      statusLaptopText.textContent = text;
    }

    function cleanupPeer() {
      if (dataConn) {
        dataConn.close();
        dataConn = null;
      }
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
    }
  </script>
</body>
</html>
